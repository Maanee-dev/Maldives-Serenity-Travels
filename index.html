<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__TITLE__</title>
    <meta name="description" content="__DESCRIPTION__">
    
    <script>
        // Inline script to prevent theme flashing
        (function() {
            const theme = localStorage.getItem('serenity-theme') || 'light';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="__TITLE__">
    <meta property="og:description" content="__DESCRIPTION__">
    <meta property="og:url" content="__URL__">
    <meta property="og:image" content="https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&q=80&w=1200">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Maldives Serenity Travels">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="__TITLE__">
    <meta name="twitter:description" content="__DESCRIPTION__">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&q=80&w=1200">
    
    <link rel="canonical" href="__URL__">
    <base href="/">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand-orange': '#f15d22',
              'brand-blue': {
                light: '#0ea5e9', // Lighter Maldivian lagoon blue
                dark: '#020617'   // Deep ocean navy
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-parchment: #FCFAF7;
            --text-charcoal: #0F172A;
            --brand-orange: #f15d22;
        }

        .dark {
            --bg-parchment: #020617;
            --text-charcoal: #F8FAFC;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-parchment);
            color: var(--text-charcoal);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            scroll-behavior: smooth;
            transition: background-color 0.5s ease;
        }

        .font-serif { font-family: 'Playfair Display', serif; }

        /* Reveal Animation System */
        .reveal { 
            opacity: 0; 
            transform: translateY(40px); 
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .reveal.active { 
            opacity: 1; 
            transform: translateY(0); 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Sophisticated Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-parchment); }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-orange); }

        .glass-nav {
            background: rgba(252, 250, 247, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass-nav {
            background: rgba(2, 6, 23, 0.85);
        }

        ::selection {
            background: rgba(241, 93, 34, 0.2);
            color: var(--brand-orange);
        }
        
        .letter-spacing-vogue {
            letter-spacing: 0.4em;
        }
    </style>

}
